# nacelle-desktop — system configuration template.
#
# A system install puts this file in /etc/xdg/nacelle/ (or wherever
# XDG_CONFIG_DIRS points). The folder is named after the nacelle
# FAMILY and the file after the program, so nacelle-ai can keep its own
# file beside this one. It is read AFTER the user's own
# ~/.config/nacelle/nacelle-desktop.conf, key by key: whatever
# the user has set wins, and every key they never touched is answered
# from here. Nothing is ever copied into a home directory — change a
# line here and every account that has not overridden it follows.
#
# Shipped with every key commented out, so out of the box this file
# decides nothing and the program uses what is built into it. Uncomment
# a line to make it a site default. Empty values mean the same as
# absent, EXCEPT in a user's own file, where an empty value is how the
# settings window switches something off.
#
# The settings window writes the user's file, never this one.

# Theme=<name>    a theme built into the toolkit, or a .theme installed
#                 under <data dir>/themes (no extension)
# Layaut=<name>   a .layaut installed under <data dir>/layauts
# Sounds=<name>   a sound-theme directory under <data dir>/sounds
#
# <data dir> is $XDG_DATA_HOME/nacelle-desktop for the user's own and
# every $XDG_DATA_DIRS/nacelle-desktop for the installed ones.

# Fonts. Term* is the terminal, UI* the interface.
# TermFontSize=<percent>    50-200
# TermFontFamily=<name>     a family from the settings list
# TermFontWeight=<name>     Light/Regular/Medium/SemiBold/Bold
# UIFontSize=<percent>      75-125
# UIFontFamily=<name>
# UIFontWeight=<name>

# Sound.
# SoundVolume=<percent>     0-100
# SoundTyping=<0|1>
# SoundAmbient=<0|1>

# Backdrop blur, in percent of what the theme asks for.
# BlurRadius=<percent>      0-100
# BlurOpacity=<percent>     0-100

# Colour pipeline (Wayland sessions only).
# ColorDepth=<bits>         8, 10, 12 or 16
# ColorSpace=<name>         auto, srgb, display p3, adobe rgb,
#                           bt2020 pq, bt2020 hlg, scrgb linear
# ColorLut=<file.cube>      a file under <data dir>/lut
# ColorIcc=<file>           a file under <data dir>/icc

# Layout editor grid.
# GridSnap=<0|1>
# GridCols=<n>              15-100
# GridRows=<n>              15-100
# GridPadding=<px>          0-40

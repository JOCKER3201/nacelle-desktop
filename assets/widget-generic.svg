<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!--
    The ADD WIDGET grid's own generic placeholder (2026-08-30): a panel
    with a header bar above its body — unmistakably GENERIC, not a
    stand-in for any one widget's own mark, so a tile drawing it never
    claims to show what the widget actually does. Every kind wears the
    SAME glyph on purpose, until each ships one of its own. Originally
    authored for this file: plain geometry, two flat rects, no stroke —
    the shape the coverage-mask pipeline assumes (see `nacelle::icon`'s
    own doc comment for why fill must be opaque), the same shape
    nacelle-addons' app-generic.svg draws for the app grid's own
    fallback, kept visually distinct from it (a bar over a body, not
    four squares) so the two "nothing more specific to show" glyphs are
    not mistaken for each other in two different pickers.
  -->
  <rect x="3" y="3" width="18" height="4" rx="1.5"/>
  <rect x="3" y="9" width="18" height="12" rx="1.5"/>
</svg>

[package]
name = "nacelle-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Independent sci-fi terminal inspired by eDEX-UI — Rust + Vulkan"
license = "MIT"

[dependencies]
# The toolkit: drawing, fonts, themes, the responsive layout engine,
# interface objects, the widget contract and its scripting, terminal
# emulation, telemetry and sound.
libnacelle = { git = "https://github.com/JOCKER3201/libnacelle" }

# The Vulkan renderer, a repository of its own — the same crate the
# project's compositor will draw with.
nacelle-renderer = { git = "https://github.com/JOCKER3201/nacelle-renderer" }

# The four core widgets — the control panel, the terminal, the file
# browser and the keyboard — linked in statically, so the program works
# with an empty widgets directory and no file can uninstall them. The
# same crates build the shipped .so; default-features = false drops the
# dlopen attach symbol, which four static copies would collide on.
nacelle-widget-control = { git = "https://github.com/JOCKER3201/nacelle-addons", default-features = false }
nacelle-widget-appgrid = { git = "https://github.com/JOCKER3201/nacelle-addons", default-features = false }
nacelle-widget-appcats = { git = "https://github.com/JOCKER3201/nacelle-addons", default-features = false }
nacelle-widget-shell = { git = "https://github.com/JOCKER3201/nacelle-addons", default-features = false }
nacelle-widget-keyboard = { git = "https://github.com/JOCKER3201/nacelle-addons", default-features = false }
nacelle-widget-filesystem = { git = "https://github.com/JOCKER3201/nacelle-addons", default-features = false }
nacelle-widget-search = { git = "https://github.com/JOCKER3201/nacelle-addons", default-features = false }

# The four AI panels of the search_and_ai board — thin clients of the
# nacelle-ai daemon, linked in exactly like the core widgets above. The
# old single nacelle-widget-ai they replace is gone from the addons
# repository altogether.
nacelle-widget-aichat = { git = "https://github.com/JOCKER3201/nacelle-addons", default-features = false }
nacelle-widget-ailoop = { git = "https://github.com/JOCKER3201/nacelle-addons", default-features = false }
nacelle-widget-aiphoto = { git = "https://github.com/JOCKER3201/nacelle-addons", default-features = false }
nacelle-widget-aisort = { git = "https://github.com/JOCKER3201/nacelle-addons", default-features = false }

# The configuration file (src/config/model.rs). Rusty Object Notation
# carries Rust's own types — enum variants, tuples, named structs — so
# the parser is DERIVED from the shape of the settings instead of being
# written out by hand at every read, which is where the defaults used
# to hide. Audited before it was added, with its whole subtree: MIT OR
# Apache-2.0, taken as MIT, and only two packages of eleven are new to
# the lock file. Declared as 0.12 because 0.10.0 is yanked.
ron = "0.12"
serde = { version = "1", features = ["derive"] }

# Making gamescope clients fullscreen (src/fullscreen.rs): plain X11
# requests on the shared XWayland display. The same crate winit
# already builds on, so this adds no new code to the tree.
x11rb = { version = "0.13", features = ["randr"] }

# The Wayland side of the colour pipeline (src/wl_color.rs): a second
# connection to the display winit already holds, speaking the Color
# Management protocol. The system backend is the same dlopen one winit
# uses — no headers, no pkg-config.
wayland-client = { version = "0.31", features = ["dlopen"] }
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

# Window + events (Linux: Wayland/X11 backends)
winit = "0.29"
raw-window-handle = "0.6"

# Clipboard backends behind the libnacelle seam (src/clipboard.rs).
# Wayland rides winit's OWN connection — smithay-clipboard attaches its
# queue to the same wl_display, which is the only way a store gets the
# input serials the compositor demands. X11/XWayland goes over x11rb,
# the crate the tree already builds (fullscreen.rs), same 0.13 line.
smithay-clipboard = "0.7"
x11-clipboard = "0.9"



# The VT parser the terminal emulation is driven by
vte = "0.13"

# System information collectors (CPU, RAM, processes, network)
sysinfo = "0.30"

# PTY / fork / exec (Linux)
# Raw system calls: the PTY (openpty/fork/execvp) and dlopen for the
# ALSA output in audio.rs — audio needs no build-time dependency.
libc = "0.2"


[profile.release]
lto = "thin"
opt-level = 3

# ------------------------------------------------------------------------


# TEMPORARY, AND IT MUST NOT SURVIVE THE MERGE.
#
# `save_theme_as` does not exist in the libnacelle this manifest PINS
# (`main` = f0f349a): it is added on the branch `fix/save-halo`, next to
# it in this worktree. Without this line the crate does not compile, so a
# gate run here would say nothing about the fix — which is exactly the
# criticism the previous round earned.
#
# The merge order is therefore fixed and one-way: libnacelle first, then
# the pin in Cargo.lock, then this crate — AND THIS BLOCK COMES OUT with
# the pin bump. A forgotten [patch] has already cost this project a
# repository that would not build on its own; the path resolves against
# the container, so it goes on working locally long after it stops being
# true anywhere else.
[patch."https://github.com/JOCKER3201/libnacelle"]
libnacelle = { path = "../libnacelle" }
